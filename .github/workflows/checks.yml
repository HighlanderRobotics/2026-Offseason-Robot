# These are just from last year, but with new wpilib docker containers
name: checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Checks that the build succeded
  build:
    name: Build
    runs-on: ubuntu-latest

    # Wpilib docker container
    # Latest as of 8/23/26
    # Need to use a container without -py. The ones with -py don't have java installed
    container: wpilib/roborio-cross-ubuntu:2025-24.04

   # Steps represent a sequence of tasks that will be executed as part of the job
   # Copied from onseason bot's action
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v3

    # Declares the repository safe and not under dubious ownership.
    - name: Add repository to git safe directories
      run: git config --global --add safe.directory $GITHUB_WORKSPACE

    # Grant execute permission for gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Runs a single command using the runners shell
    - name: Compile and run tests on robot code
      run: ./gradlew build
  
  format:
    name: Format

    runs-on: ubuntu-latest

    # Wpilib docker container
    # Latest as of 8/23/26
    # Need to use a container without -py. The ones with -py don't have java installed
    container: wpilib/roborio-cross-ubuntu:2025-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    # Copied from Onseason implementation
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v3

    # Declares the repository safe and not under dubious ownership.
    - name: Add repository to git safe directories
      run: git config --global --add safe.directory $GITHUB_WORKSPACE

    # Grant execute permission for gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Runs a single command using the runners shell
    - name: Run formatting check
      run: ./gradlew spotlessCheck

  # Foresight's code check (Hindsight): reports likely bugs (integer division, a value never set, a CAN ID used twice…)
  # as notes on the PR. Report only: it never fails the run. Pinned to one Hindsight commit, so a new rule can't
  # turn this red until we choose to move the pin.
  code-check:
    name: Code check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: kevinclark/hindsight@04ac0ebe77db38cde87f75c534f252f79c7971ee # main 2026-10-21
      with:
        fail-on: none
